<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I've got something for you.... ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ffb199,#ffd1dc);
background-size:400% 400%;
animation:bg 10s infinite ease;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.card{
background:white;
padding:40px;
border-radius:25px;
box-shadow:0 15px 35px rgba(0,0,0,.25);
text-align:center;
width:420px;
z-index:2;
}

h1{
font-size:30px;
color:#ff4f81;
}

p{
margin:20px 0;
font-size:18px;
color:#555;
min-height:55px;
}

button{
padding:15px 35px;
font-size:18px;
border:none;
border-radius:40px;
cursor:pointer;
transition:.3s;
margin:10px;
}

#yes{
background:#ff4f81;
color:white;
box-shadow:0 0 15px #ff4f81;
}

#yes:hover{
transform:scale(1.15);
}

#no{
background:#ddd;
position:relative;
}

#result{
display:none;
font-size:28px;
color:#ff4f81;
animation:pop .5s;
}

@keyframes pop{
from{transform:scale(.2);}
to{transform:scale(1);}
}

.heart{
position:fixed;
bottom:-50px;
font-size:25px;
animation:float 8s linear infinite;
opacity:.8;
}

@keyframes float{
to{
transform:translateY(-120vh) rotate(360deg);
opacity:0;
}
}
</style>
</head>

<body>

<div class="card">

<h1>👋 Hi!</h1>

<p id="text"></p>

<div id="buttons">
<button id="yes">Yes ❤️</button>
<button id="no">No 🙈</button>
</div>

<div id="result">
🌼❤️<br><br>
Anyways, you are such a wonderful and amazing person.<br>
I know you fought so much battles today, just remember
you deserve a rest. 🌹
</div>

</div>

<script>

const message="I've got somethingg for yaaa... 😊";
let i=0;

function type(){
if(i<message.length){
document.getElementById("text").innerHTML+=message.charAt(i);
i++;
setTimeout(type,60);
}
}
type();

const no=document.getElementById("no");
let count=0;

no.addEventListener("mouseover",()=>{

if(count<8){

const x=Math.random()*(window.innerWidth-120);
const y=Math.random()*(window.innerHeight-70);

no.style.position="fixed";
no.style.left=x+"px";
no.style.top=y+"px";

count++;

document.getElementById("yes").style.transform=`scale(${1+count*0.12})`;

}else{

no.innerHTML="Edi wagg🙄";

}

});

document.getElementById("yes").onclick=()=>{

document.getElementById("buttons").style.display="none";

document.getElementById("result").style.display="block";

confetti();

}

function confetti(){

for(let i=0;i<150;i++){

const h=document.createElement("div");

h.innerHTML=Math.random()>.5?"❤️":"✨";

h.className="heart";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=3+Math.random()*5+"s";

h.style.fontSize=(20+Math.random()*30)+"px";

document.body.appendChild(h);

setTimeout(()=>h.remove(),8000);

}

}

for(let i=0;i<30;i++){

const h=document.createElement("div");

h.className="heart";

h.innerHTML="💖";

h.style.left=Math.random()*100+"vw";

h.style.animationDuration=4+Math.random()*6+"s";

h.style.animationDelay=Math.random()*6+"s";

document.body.appendChild(h);

}

</script>

</body>
</html>
